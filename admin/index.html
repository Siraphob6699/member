<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Member Club · หลังบ้าน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: {
      fontFamily: { thai: ['"Noto Sans Thai"', 'sans-serif'] },
      colors: { brand: { 50: '#FDECEC', 100: '#FAD4D3', 200: '#F5A9A7', 500: '#E53935', 600: '#C62828', 700: '#B71C1C' } },

  <style>

    textarea.inp { height: auto; padding: .6rem .9rem; }
    th { font-weight: 500; }
  </style>
</head>
<body class="font-thai bg-neutral-100 text-neutral-900">
<div id="app"></div>

<script>
// shortcut: paste the Apps Script web app URL here; leave empty (or open with ?demo=1) to preview with sample data.
const API = 'https://script.google.com/macros/s/AKfycbye6_qNN9IgpHjAFOc5KEOzRfXBroZkvwMAfJxRAM7qeRyUIrgcRMTFRKH0ppd3GH7x/exec';
const DEMO = !API || new URLSearchParams(location.search).has('demo');
const LIFF_BASE = 'https://liff.line.me/';

const A = { token: localStorage.getItem('crm_token'), name: localStorage.getItem('crm_name') || '', shops: [], oas: [], webhookBase: '', shopId: localStorage.getItem('crm_shop'), page: 'dashboard', arg: null, menu: false, liffReady: false };
const app = document.getElementById('app');
const R = []; // handler registry: onclick="fn(R[3])" avoids quoting objects into HTML
const reg = o => (R.push(o), `R[${R.length - 1}]`);

// ---------- helpers ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = n => Number(n || 0).toLocaleString('th-TH');
const baht = n => '฿' + num(n);
const date = d => d ? new Date(d).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }) : '-';
const dt = d => d ? date(d) + ' ' + new Date(d).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) : '-';
const ymd = iso => iso ? new Date(iso).toLocaleDateString('sv-SE', { timeZone: 'Asia/Bangkok' }) : '';
const monthTh = k => new Date(k + '-15').toLocaleDateString('th-TH', { month: 'short', year: 'numeric' });
const shop = () => A.shops.find(s => s.shop_id === A.shopId);

const I = {
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  store: '<path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M5 13v7h14v-7"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
  gift: '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',
  mega: '<path d="M3 10v4a1 1 0 0 0 1 1h3l6 4V5L7 9H4a1 1 0 0 0-1 1z"/><path d="M17 8a5 5 0 0 1 0 8"/>',
  cog: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
  close: '<path d="M18 6L6 18M6 6l12 12"/>',
  out: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  edit: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  star: '<path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2-5.5-2.9-5.5 2.9 1-6.2L3 9.6l6.2-.9z"/>',
  coins: '<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>',
  ticket: '<path d="M3 9a3 3 0 0 0 0 6v2a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-2a3 3 0 0 0 0-6V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2z"/><path d="M13 5v2M13 17v2M13 11v2"/>',
  bag: '<path d="M6 7h12l1 14H5z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  back: '<path d="M15 18l-6-6 6-6"/>',
  up: '<path d="M7 17L17 7M8 7h9v9"/>',
  down: '<path d="M7 7l10 10M17 8v9H8"/>',
  link: '<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
};
const icon = (n, c = 'w-5 h-5') => `<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;

const TIER_BADGE = { Member: 'bg-white text-neutral-700 ring-1 ring-neutral-200', Silver: 'bg-slate-200 text-slate-700', Gold: 'bg-amber-100 text-amber-800', Black: 'bg-neutral-900 text-white' };
const tierBadge = t => `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold ${TIER_BADGE[t] || 'bg-violet-50 text-violet-700'}">${esc(t)}</span>`;
const TYPES = [['baht', 'ส่วนลด (บาท)'], ['percent', 'ส่วนลด (%)'], ['gift', 'ของแถม'], ['shipping', 'ส่งฟรี']];
const typeName = t => (TYPES.find(x => x[0] === t) || [, 'อื่นๆ'])[1];
const rewardLine = r => r.type === 'baht' ? `ลด ${num(r.value)} บาท` : r.type === 'percent' ? `ลด ${r.value}%` : r.type === 'shipping' ? 'ส่งฟรี' : (r.value || 'ของแถม');
const btnP = 'inline-flex items-center justify-center gap-2 h-10 px-4 rounded-xl bg-brand-500 hover:bg-brand-600 text-white font-semibold text-sm disabled:opacity-50';
const btnS = 'inline-flex items-center justify-center gap-2 h-10 px-4 rounded-xl border border-brand-500 text-brand-700 hover:bg-brand-50 font-semibold text-sm';
const btnG = 'inline-flex items-center justify-center gap-1.5 h-9 px-3 rounded-lg text-slate-500 hover:bg-slate-100 text-sm';
const toggle = (on, h) => `<button onclick="${h}" class="w-11 h-6 rounded-full relative transition ${on ? 'bg-brand-500' : 'bg-slate-200'}" aria-label="เปิด/ปิด"><span class="absolute top-0.5 ${on ? 'left-[22px]' : 'left-0.5'} w-5 h-5 rounded-full bg-white shadow transition-all"></span></button>`;

function toast(msg, bad) {
  const t = document.createElement('div');
  t.className = `fixed right-4 bottom-4 z-[60] text-sm px-4 py-3 rounded-xl shadow-lg ${bad ? 'bg-rose-600' : 'bg-slate-900'} text-white`;
  t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 2800);
}
async function copy(text) { await navigator.clipboard.writeText(text); toast('คัดลอกแล้ว'); }

// ---------- api ----------
// Read results are kept so a page can show its last data instantly while fresh data loads (each server call takes seconds).
const READS = ['shops', 'dashboard', 'customers', 'customer', 'rewards', 'tiers', 'campaigns', 'audit'];
let CACHED_ONLY = false;
async function api(action, extra = {}) {
  const key = 'crm_c:' + action + JSON.stringify(extra);
  if (CACHED_ONLY) { const c = localStorage.getItem(key); if (c === null) throw new Error('not cached'); return JSON.parse(c); }
  if (DEMO) return demo(action, extra);
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ admin: true, action, token: A.token, ...extra }) });
  const j = await r.json();
  if (j && j.relogin) { logout(); throw new Error(j.error); }
  if (j && j.error) throw new Error(j.error);
  if (READS.includes(action) && !extra.q) try { localStorage.setItem(key, JSON.stringify(j)); } catch (e) { /* storage full: just no instant view */ }
  return j;
}

// ---------- modal form ----------
// fields: {k, label, type: text|number|select|checkbox|date|textarea|password, options: [[value,label]], hint}
function formModal(title, fields, vals, onSave) {
  const m = document.createElement('div');
  m.className = 'fixed inset-0 z-50 bg-slate-900/40 flex items-end sm:items-center justify-center p-0 sm:p-6';
  const field = f => {
    const v = vals[f.k] ?? '';
    const id = 'f_' + f.k;
    if (f.type === 'checkbox') return `<label class="flex items-center gap-3 text-sm"><input id="${id}" type="checkbox" ${v === 'TRUE' || v === true ? 'checked' : ''} class="w-5 h-5 accent-[#E53935]"> ${f.label}</label>`;
    const input = f.type === 'select' ? `<select id="${id}" class="inp">${f.options.map(([o, l]) => `<option value="${esc(o)}" ${String(o) === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`
      : f.type === 'textarea' ? `<textarea id="${id}" rows="3" class="inp">${esc(v)}</textarea>`
      : `<input id="${id}" type="${f.type || 'text'}" value="${esc(v)}" class="inp" ${f.type === 'number' ? 'step="any"' : ''}>`;
    return `<label class="block"><span class="text-sm font-medium">${f.label}</span><div class="mt-1.5">${input}</div>${f.hint ? `<span class="text-xs text-slate-400">${f.hint}</span>` : ''}</label>`;
  };
  m.innerHTML = `<form class="bg-white w-full sm:max-w-lg max-h-[92vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl p-6">
    <div class="flex items-center justify-between"><h3 class="text-lg font-bold">${title}</h3><button type="button" data-x class="${btnG}">${icon('close')}</button></div>
    <div class="mt-5 space-y-4">${fields.map(field).join('')}</div>
    <div class="mt-6 flex gap-2 justify-end"><button type="button" data-x class="${btnG} h-10 px-4">ยกเลิก</button><button class="${btnP}">บันทึก</button></div></form>`;
  m.querySelectorAll('[data-x]').forEach(b => (b.onclick = () => m.remove()));
  m.querySelector('form').onsubmit = async e => {
    e.preventDefault();
    const out = {};
    fields.forEach(f => { const el = m.querySelector('#f_' + f.k); out[f.k] = f.type === 'checkbox' ? (el.checked ? 'TRUE' : 'FALSE') : el.value.trim(); });
    const b = m.querySelector('button:not([type])'); b.disabled = true;
    try { await onSave(out); m.remove(); toast('บันทึกแล้ว'); } catch (err) { toast(err.message, true); b.disabled = false; }
  };
  document.body.append(m);
}
function confirmBox(text, onYes) {
  formModal(text, [], {}, onYes);
  document.querySelector('.fixed form button:not([type])').textContent = 'ยืนยัน';
}

// ---------- shell ----------
const NAV = [['dashboard', 'ภาพรวม', 'home'], ['shops', 'ร้าน', 'store'], ['customers', 'ลูกค้า', 'users'], ['coupon', 'ตรวจคูปอง', 'ticket'], ['rewards', 'ของรางวัล', 'gift'], ['campaigns', 'แคมเปญ', 'mega'], ['settings', 'ตั้งค่า', 'cog'], ['audit', 'ประวัติการแก้ไข', 'list']];
const TITLES = {
  dashboard: ['ภาพรวม', 'สรุปข้อมูลสมาชิก และยอดขายจากระบบสะสมแต้ม'], shops: ['ร้าน', 'ร้าน KetShop และ LINE OA ที่ผูกไว้'],
  customers: ['ลูกค้า', 'ค้นหาสมาชิกด้วยเบอร์โทร'], coupon: ['ตรวจคูปอง', 'ใส่รหัสจากภาพที่ลูกค้าส่งมา เช็กว่าจริงไหม ใช้ไปแล้วหรือยัง'], customer: ['รายละเอียดลูกค้า', ''], rewards: ['ของรางวัล', 'รางวัลและคูปองที่ลูกค้าแลกได้'],
  campaigns: ['แคมเปญ', 'เลือก template แล้วตั้งค่าได้เลย'], settings: ['ตั้งค่า', 'แต้ม ระดับสมาชิก และผู้ดูแลระบบ'], audit: ['ประวัติการแก้ไข', 'ใครทำอะไร เมื่อไหร่ (300 รายการล่าสุด)'],
};

function shell() {
  const cur = A.page === 'customer' ? 'customers' : A.page;
  const [title, sub] = TITLES[A.page];
  app.innerHTML = `<div class="min-h-screen lg:flex">
    <div class="${A.menu ? '' : 'hidden'} lg:hidden fixed inset-0 bg-slate-900/30 z-30" onclick="A.menu=false;shell();paint()"></div>
    <aside class="${A.menu ? 'translate-x-0' : '-translate-x-full'} lg:translate-x-0 fixed lg:sticky top-0 left-0 z-40 h-screen w-72 shrink-0 p-4 transition-transform">
      <div class="h-full flex flex-col p-5 rounded-[1.25rem] bg-neutral-950 text-white shadow-soft">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-2xl bg-brand-500 text-white grid place-items-center">${icon('store', 'w-6 h-6')}</div>
          <div><p class="text-lg font-bold leading-tight">Member Club</p><p class="text-xs text-neutral-400">ระบบสมาชิกสะสมแต้ม</p></div>
        </div>
        <nav class="mt-8 space-y-1 flex-1">${NAV.map(([k, t, ic]) => `<button onclick="nav('${k}')" class="w-full flex items-center gap-4 h-12 px-4 rounded-2xl ${k === cur ? 'bg-brand-500 text-white font-bold' : 'text-neutral-300 hover:bg-white/10'}">${icon(ic, 'w-[22px] h-[22px]')}<span>${t}</span></button>`).join('')}</nav>
        <div class="border-t border-white/10 pt-4 flex items-center gap-3">
          <div class="w-11 h-11 rounded-full bg-white/10 text-white grid place-items-center font-bold">${esc(A.name.slice(0, 1))}</div>
          <div class="flex-1 min-w-0"><p class="font-semibold truncate">${esc(A.name)}</p><p class="text-xs text-neutral-400">ผู้ดูแลระบบ</p></div>
          <button onclick="logout()" class="inline-flex items-center justify-center h-9 px-3 rounded-lg text-neutral-400 hover:bg-white/10 hover:text-white" title="ออกจากระบบ" aria-label="ออกจากระบบ">${icon('out')}</button>
        </div>
      </div>
    </aside>
    <main class="flex-1 min-w-0 p-4 lg:pl-0">
      <div class="card p-5 lg:p-6 flex flex-wrap items-center gap-4">
        <button class="lg:hidden ${btnG}" onclick="A.menu=true;shell();paint()">${icon('menu', 'w-6 h-6')}</button>
        <div class="flex-1 min-w-[180px]"><h1 class="text-2xl lg:text-[28px] font-extrabold">${title}</h1>${sub ? `<p class="text-sm text-slate-400 mt-0.5">${sub}</p>` : ''}</div>
        ${A.shops.length && !['shops', 'audit'].includes(A.page) ? `<label class="relative">${icon('store', 'w-5 h-5 absolute left-3.5 top-3 text-brand-600')}
          <select onchange="setShop(this.value)" class="inp pl-11 pr-8 min-w-[200px]">${A.shops.map(s => `<option value="${esc(s.shop_id)}" ${s.shop_id === A.shopId ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>` : ''}
      </div>
      <div id="page" class="mt-4"></div>
    </main></div>`;
}

function nav(page, arg) { A.page = page; A.arg = arg; A.menu = false; shell(); paint(); window.scrollTo(0, 0); }
function setShop(id) { A.shopId = id; localStorage.setItem('crm_shop', id); paint(); }
let paintSeq = 0;
async function paint() {
  const el = document.getElementById('page'), seq = ++paintSeq;
  R.length = 0;
  el.innerHTML = `<div class="card p-16 grid place-items-center"><div class="w-9 h-9 rounded-full border-4 border-brand-100 border-t-brand-500 animate-spin"></div></div>`;
  if (!A.shopId && !['shops', 'settings', 'audit', 'coupon'].includes(A.page)) {
    el.innerHTML = `<div class="card p-12 text-center"><p class="text-lg font-bold">ยังไม่มีร้าน</p><p class="text-slate-400 mt-1">เริ่มจากสร้างร้านและผูก LINE OA</p><button class="${btnP} mt-5" onclick="nav('shops')">ไปที่หน้าร้าน</button></div>`;
    return;
  }
  // Last data first (settings keeps edit state while rendering, so it always waits for fresh data).
  const same = h => h.replace(/R\[\d+\]/g, 'R');
  let stale = '';
  if (A.page !== 'settings') {
    CACHED_ONLY = true;
    try { stale = await P[A.page](A.arg); el.innerHTML = stale; } catch (e) { /* nothing cached yet */ } finally { CACHED_ONLY = false; }
  }
  try {
    const html = await P[A.page](A.arg);
    // Unchanged data keeps the shown page, so nothing flickers and typed text survives.
    if (seq === paintSeq && same(html) !== same(stale)) el.innerHTML = html;
  } catch (e) { if (seq === paintSeq) el.innerHTML = `<div class="card p-10 text-center text-rose-600">${esc(e.message)}</div>`; }
}
const refresh = () => paint();

// ---------- pages ----------
const P = {};

P.dashboard = async () => {
  const d = await api('dashboard', { shopId: A.shopId });
  const cur = d.months[5], prev = d.months[4];
  const change = (a, b) => b ? Math.round(((a - b) / b) * 1000) / 10 : null;
  const stat = (ic, color, label, val, fmt = num) => {
    const c = change(cur[val], prev[val]);
    return `<div class="card p-5"><div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-full grid place-items-center ${color}">${icon(ic, 'w-6 h-6')}</div>
      <div class="min-w-0"><p class="text-sm text-slate-500">${label}</p><p class="text-2xl font-extrabold">${fmt(cur[val])}</p></div></div>
      <p class="text-xs mt-3 ${c === null ? 'text-slate-400' : c >= 0 ? 'text-emerald-600' : 'text-rose-500'} flex items-center gap-1">${c === null ? 'ยังไม่มีข้อมูลเดือนก่อน' : `${icon(c >= 0 ? 'up' : 'down', 'w-4 h-4')}<b>${c >= 0 ? '+' : ''}${c}%</b> <span class="text-slate-400">จากเดือนก่อน</span>`}</p></div>`;
  };
  const max = Math.max(1, ...d.months.map(m => m.members));
  const COLORS = { baht: '#E53935', percent: '#8B5CF6', gift: '#F5C04A', shipping: '#F472B6', other: '#CBD5E1' };
  const total = Object.values(d.byType).reduce((s, n) => s + n, 0);
  let acc = 0;
  const segs = Object.entries(d.byType).map(([t, n]) => { const from = acc; acc += (n / total) * 100; return `${COLORS[t] || COLORS.other} ${from}% ${acc}%`; });
  return `<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-5 gap-4">
      ${stat('users', 'bg-brand-50 text-brand-600', 'สมาชิกใหม่เดือนนี้', 'members')}
      ${stat('star', 'bg-amber-50 text-amber-500', 'แต้มที่แจก', 'issued')}
      ${stat('coins', 'bg-rose-50 text-rose-500', 'แต้มที่ถูกแลก', 'redeemed')}
      ${stat('ticket', 'bg-violet-50 text-violet-500', 'คูปองที่ใช้', 'couponsUsed')}
      ${stat('bag', 'bg-brand-50 text-brand-600', 'ยอดซื้อสมาชิก', 'spend', baht)}
    </div>
    <div class="grid grid-cols-1 xl:grid-cols-3 gap-4 mt-4">
      <div class="card p-6 xl:col-span-2">

  return `<div class="overflow-x-auto mt-4"><table class="w-full text-sm whitespace-nowrap">
    <thead><tr class="bg-slate-50 text-slate-500 text-left"><th class="p-3 rounded-l-xl">ชื่อ</th><th class="p-3">เบอร์โทร</th><th class="p-3">ระดับ</th><th class="p-3 text-right">แต้ม</th><th class="p-3 text-right">${recent ? 'ยอดซื้อสะสม' : 'LINE'}</th><th class="p-3 ${recent ? 'rounded-r-xl' : ''}">${recent ? 'สมัครเมื่อ' : 'ซื้อล่าสุด'}</th>${recent ? '' : '<th class="p-3 rounded-r-xl"></th>'}</tr></thead>
    <tbody class="divide-y divide-slate-100">${list.map(c => `<tr class="hover:bg-brand-50/50 cursor-pointer" onclick="nav('customer','${esc(c.customer_id)}')">
      <td class="p-3"><div class="flex items-center gap-3">${c.picture ? `<img src="${esc(c.picture)}" class="w-9 h-9 rounded-full object-cover" alt="">` : `<div class="w-9 h-9 rounded-full bg-brand-50 text-brand-700 grid place-items-center font-bold">${esc((c.name || '?').slice(0, 1))}</div>`}<span class="font-medium">${esc(c.name || '-')}</span></div></td>
      <td class="p-3">${esc(c.phone.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3'))}</td>
      <td class="p-3">${tierBadge(c.tier)}</td><td class="p-3 text-right font-semibold">${num(c.points)}</td>
      <td class="p-3 text-right">${recent ? baht(c.spend) : c.linked ? '<span class="text-emerald-600">ผูกแล้ว</span>' : '<span class="text-slate-400">ยังไม่ผูก</span>'}</td>
      <td class="p-3 text-slate-500">${date(recent ? c.consent_at : c.last_order)}</td>${recent ? '' : `<td class="p-3 text-right"><button class="${btnG}" onclick="event.stopPropagation();adjustPoints('${esc(c.customer_id)}', '${esc(c.phone)}')">${icon('coins')} เพิ่ม/ลดแต้ม</button></td>`}</tr>`).join('')}</tbody></table></div>`;
}

    { k: 'name', label: 'ชื่อร้าน' },

    { k: 'point_expiry_days', label: 'แต้มมีอายุกี่วัน', type: 'number', hint: 'นับจากวันที่ได้แต้มแต่ละบิล' },
    { k: 'ketshop_key', label: 'KetShop Token', hint: 'KetShop → Extension → n8n → สร้าง Token' },
    { k: 'notify_points', label: 'ส่ง LINE แจ้งลูกค้าเมื่อได้แต้ม (ใช้โควตาข้อความ OA)', type: 'checkbox' },

function editCampaign(c) {
  const [title, , , params] = TEMPLATES[c.template];
  const rewardOpts = [['', '— เลือก —'], ...(A.rewards || []).map(r => [r.reward_id, `${r.name}${Number(r.points_cost) ? ` (${num(r.points_cost)} แต้ม)` : ' (ฟรี)'}`])];
  const fields = params.map(p => p.type === 'reward' ? { ...p, k: 'p_' + p.k, type: 'select', options: rewardOpts } : { ...p, k: 'p_' + p.k });
  const vals = { active: 'TRUE', start_at: ymd(c.start_at) || ymd(new Date().toISOString()), end_at: ymd(c.end_at), ...c };
  Object.entries(JSON.parse(c.params_json || '{}')).forEach(([k, v]) => (vals['p_' + k] = v));
  vals.start_at = ymd(c.start_at) || vals.start_at; vals.end_at = ymd(c.end_at);
  formModal(`${c.campaign_id ? 'แก้ไข' : 'สร้าง'}แคมเปญ: ${title}`, [...fields,
    { k: 'start_at', label: 'วันเริ่ม', type: 'date' }, { k: 'end_at', label: 'วันจบ', type: 'date' }, { k: 'active', label: 'เปิดใช้งาน', type: 'checkbox' },
  ], vals, async v => {
    if (!v.start_at || !v.end_at) throw new Error('กรุณาเลือกวันเริ่มและวันจบ');
    const params = {};
    Object.keys(v).filter(k => k.startsWith('p_')).forEach(k => (params[k.slice(2)] = v[k]));
    await saveCampaign({ campaign_id: c.campaign_id, shop_id: A.shopId, template: c.template, params_json: JSON.stringify(params), active: v.active,

  });
}

async function loginPw(f) {

}

async function ensureLiff() {
  if (A.liffReady) return;
  const { liffId } = await api('config');
  if (!liffId) throw new Error('ยังไม่ได้ตั้งค่า ADMIN_LIFF_ID ใน Script Properties');
  await liff.init({ liffId });
  A.liffReady = true;
}

// mode: 'login' or 'link'. The flag survives the LINE login redirect.
async function startLine(mode) {
  if (DEMO) return toast('โหมดตัวอย่าง: ข้ามการเข้าสู่ระบบด้วย LINE'), mode === 'login' && done({ token: 'demo', name: 'คุณฟลุ๊ค' });
  sessionStorage.setItem('crm_line', mode);
  try {
    await ensureLiff();
    if (!liff.isLoggedIn()) return liff.login({ redirectUri: location.href.split('#')[0] });
    await finishLine();
  } catch (e) { sessionStorage.removeItem('crm_line'); mode === 'login' ? loginView(e.message) : toast(e.message, true); }
}

async function finishLine() {
  const mode = sessionStorage.getItem('crm_line');
  sessionStorage.removeItem('crm_line');
  const idToken = liff.getIDToken();
  if (mode === 'link') { await api('linkLine', { idToken }); toast('ผูก LINE แล้ว'); if (A.page === 'settings') refresh(); }
  else done(await api('loginLine', { idToken }));
}

function done(r) {
  A.token = r.token; A.name = r.name;
  localStorage.setItem('crm_token', r.token); localStorage.setItem('crm_name', r.name);
  boot();
}

function logout() {
  localStorage.removeItem('crm_token'); A.token = null;
  Object.keys(localStorage).filter(k => k.startsWith('crm_c:')).forEach(k => localStorage.removeItem(k));
  if (A.liffReady && liff.isLoggedIn()) liff.logout();
  loginView();
}

async function boot() {
  if (!A.token) return loginView();
  const show = d => {
    Object.assign(A, { shops: d.shops, oas: d.oas, webhookBase: d.webhookBase });
    if (!A.shops.some(s => s.shop_id === A.shopId)) A.shopId = (A.shops[0] || {}).shop_id || null;
    shell(); paint();
  };
  const cached = localStorage.getItem('crm_c:shops{}');
  if (cached) show(JSON.parse(cached));
  try {
    const d = await api('shops');
    if (JSON.stringify(d) !== cached) show(d);
  } catch (e) { loginView(e.message); }
}

(async () => {
  if (!DEMO && sessionStorage.getItem('crm_line')) {
    try { await ensureLiff(); if (liff.isLoggedIn()) await finishLine(); } catch (e) { toast(e.message, true); }
  }
  boot();
})();
