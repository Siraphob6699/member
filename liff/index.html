<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>บัตรสมาชิก</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: {
      fontFamily: { thai: ['"Noto Sans Thai"', 'sans-serif'] },
      colors: { mint: { 50: '#EEF9F3', 100: '#D8F2E4', 500: '#2DB674', 600: '#22A065', 700: '#17804F' } },
      boxShadow: { soft: '0 6px 24px -8px rgba(23,128,79,.18)' },
    } } };
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .ticket { -webkit-mask: radial-gradient(circle 10px at 0 50%, #0000 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 10px at 100% 50%, #0000 98%, #000) right / 51% 100% no-repeat; }
  </style>
</head>
<body class="font-thai bg-mint-50/60 text-slate-800">
<div id="app" class="max-w-md mx-auto min-h-screen bg-white"></div>

<script>
// shortcut: paste the Apps Script web app URL here; leave empty (or open with ?demo=1) to preview with sample data.
const API = 'https://script.google.com/macros/s/AKfycbye6_qNN9IgpHjAFOc5KEOzRfXBroZkvwMAfJxRAM7qeRyUIrgcRMTFRKH0ppd3GH7x/exec';
const params = new URLSearchParams(location.search);
// LIFF passes our query inside liff.state on the first redirect
const stateQs = new URLSearchParams((params.get('liff.state') || '').replace(/^[^?]*\?/, ''));
const OA = params.get('oa') || stateQs.get('oa');
const DEMO = !API || params.has('demo');

const S = { idToken: null, me: null, rewards: [], coupons: [], history: [], stack: [] };
const app = document.getElementById('app');

// ---------- helpers ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = n => Number(n || 0).toLocaleString('th-TH');
const date = d => new Date(d).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
const time = d => new Date(d).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.';
const nowIso = () => new Date().toISOString();

const I = {
  back: '<path d="M15 18l-6-6 6-6"/>',
  close: '<path d="M18 6L6 18M6 6l12 12"/>',
  gift: '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',
  ticket: '<path d="M3 9a3 3 0 0 0 0 6v2a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-2a3 3 0 0 0 0-6V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2z"/><path d="M13 5v2M13 17v2M13 11v2"/>',
  history: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
  crown: '<path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 12H5z"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  chev: '<path d="M9 6l6 6-6 6"/>',
  truck: '<path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',
  pct: '<path d="M19 5L5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/>',
  phone: '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
};
const icon = (n, c = 'w-5 h-5') => `<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const coin = '<span class="inline-block w-4 h-4 rounded-full bg-gradient-to-b from-amber-300 to-amber-500 ring-2 ring-amber-200 align-[-2px]"></span>';

const TIER_CARD = {
  Gold: 'from-[#F8E7B5] via-[#EBCB7A] to-[#D9AE52] text-amber-950',
  Silver: 'from-slate-100 via-slate-200 to-slate-300 text-slate-800',
  Member: 'from-mint-100 via-mint-100 to-[#BFE9D3] text-mint-700',
};
const typeIcon = t => t === 'shipping' ? 'truck' : t === 'gift' ? 'gift' : 'pct';
const rewardLine = r => r.type === 'baht' ? `ลด ${num(r.value)} บาท` : r.type === 'percent' ? `ลด ${r.value}%` : r.type === 'shipping' ? 'ส่งฟรี' : (r.value || 'ของแถม');
const couponState = c => c.status === 'used' ? 'used' : c.expires_at <= nowIso() ? 'expired' : 'ready';

function header(title, { back = true } = {}) {
  return `<div class="sticky top-0 z-10 bg-white/90 backdrop-blur flex items-center justify-between px-4 h-14">
    <button class="w-9 h-9 grid place-items-center ${back ? '' : 'invisible'}" onclick="goBack()" aria-label="ย้อนกลับ">${icon('back', 'w-6 h-6')}</button>
    <h1 class="text-[17px] font-bold">${title}</h1>
    <button class="w-9 h-9 grid place-items-center" onclick="closeApp()" aria-label="ปิด">${icon('close', 'w-6 h-6')}</button>
  </div>`;
}
const btn = (label, on, extra = '') => `<button onclick="${on}" class="w-full h-12 rounded-2xl bg-mint-500 active:bg-mint-600 text-white font-semibold shadow-soft disabled:bg-slate-200 disabled:text-slate-400 disabled:shadow-none ${extra}">${label}</button>`;

// ---------- api ----------
async function api(action, extra = {}) {
  if (DEMO) return demo(action, extra);
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action, oaId: OA, idToken: S.idToken, ...extra }) });
  const j = await r.json();
  if (j && j.error) throw new Error(j.error);
  return j;
}

// ---------- navigation ----------
function go(view, arg) { S.stack.push([view, arg]); render(); window.scrollTo(0, 0); }
function goBack() { if (S.stack.length > 1) { S.stack.pop(); render(); } else closeApp(); }
function closeApp() { if (!DEMO && liff.isInClient()) liff.closeWindow(); }
function render() { const [v, a] = S.stack[S.stack.length - 1]; app.innerHTML = V[v](a); }
function showError(msg) { app.innerHTML = `<div class="p-8 pt-24 text-center"><p class="text-lg font-bold">เกิดข้อผิดพลาด</p><p class="text-slate-500 mt-2">${esc(msg)}</p></div>`; }
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'fixed left-1/2 -translate-x-1/2 bottom-8 bg-slate-900 text-white text-sm px-4 py-2.5 rounded-xl z-50';
  t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 2500);
}

// ---------- views ----------
const V = {};

V.loading = () => `<div class="min-h-screen grid place-items-center"><div class="w-10 h-10 rounded-full border-4 border-mint-100 border-t-mint-500 animate-spin"></div></div>`;

V.bind = (err) => `${header('ลงทะเบียนสมาชิก', { back: false })}
  <div class="px-6 pt-4 pb-10">
    <div class="w-16 h-16 rounded-2xl bg-mint-50 text-mint-500 grid place-items-center mx-auto">${icon('crown', 'w-8 h-8')}</div>
    <h2 class="text-center text-xl font-bold mt-4">สมัครสมาชิกสะสมแต้ม</h2>
    <p class="text-center text-slate-500 text-sm mt-1">ใส่เบอร์โทรที่ใช้สั่งซื้อ ครั้งเดียว ใช้ได้ตลอด</p>
    ${err ? `<div class="mt-6 rounded-2xl bg-rose-50 text-rose-600 text-sm px-4 py-3">${esc(err)}</div>` : ''}
    <label class="block mt-6 text-sm font-semibold">เบอร์โทรศัพท์</label>
    <input id="phone" type="tel" inputmode="numeric" maxlength="12" placeholder="08x-xxx-xxxx" class="mt-2 w-full h-12 rounded-2xl border border-slate-200 px-4 text-lg tracking-wide focus:outline-none focus:border-mint-500 focus:ring-4 focus:ring-mint-100">
    <label class="block mt-5 text-sm font-semibold">วันเกิด <span class="text-slate-400 font-normal">(ไม่บังคับ · รับคูปองเดือนเกิด)</span></label>
    <input id="bday" type="date" class="mt-2 w-full h-12 rounded-2xl border border-slate-200 px-4 focus:outline-none focus:border-mint-500 focus:ring-4 focus:ring-mint-100">
    <label class="flex gap-3 items-start mt-6 text-sm text-slate-600">
      <input id="consent" type="checkbox" class="mt-0.5 w-5 h-5 accent-[#2DB674]">
      <span>ยอมรับ <button type="button" class="text-mint-600 font-semibold underline" onclick="document.getElementById('policy').classList.toggle('hidden')">นโยบายความเป็นส่วนตัว</button> ให้ร้านเก็บเบอร์โทรและประวัติการซื้อเพื่อสะสมแต้มและส่งสิทธิพิเศษ</span>
    </label>
    <p id="policy" class="hidden mt-3 text-xs text-slate-500 bg-slate-50 rounded-xl p-3">ร้านเก็บเบอร์โทร วันเกิด LINE ID และประวัติการซื้อ เพื่อคำนวณแต้ม ออกคูปอง และแจ้งสิทธิพิเศษเท่านั้น ไม่เปิดเผยต่อบุคคลอื่น ขอลบข้อมูลได้โดยทักแอดมินในแชต</p>
    <div class="mt-8">${btn('ยืนยัน', 'doBind(this)')}</div>
  </div>`;

V.home = () => {
  const m = S.me;
  const target = m.nextTier ? m.spend12m + m.nextTier.need : 0;
  const pct = target ? Math.min(100, Math.round((m.spend12m / target) * 100)) : 100;
  const menu = [['gift', 'ของรางวัล', 'แลกของพิเศษ', 'rewards'], ['ticket', 'คูปองของฉัน', 'ดูคูปองทั้งหมด', 'coupons'], ['history', 'ประวัติแต้ม', 'ดูรายการย้อนหลัง', 'history']];
  return `${header('บัตรสมาชิก', { back: false })}
  <div class="px-5 pb-10">
    <div class="flex items-center gap-3 mt-2">
      ${m.picture ? `<img src="${esc(m.picture)}" class="w-14 h-14 rounded-full object-cover" alt="">` : `<div class="w-14 h-14 rounded-full bg-mint-100"></div>`}
      <div><p class="text-sm text-slate-500">สวัสดีค่ะ</p><p class="text-lg font-bold flex items-center gap-1.5">${esc(m.name)} <span class="w-5 h-5 rounded-full bg-[#06C755] text-white grid place-items-center">${icon('check', 'w-3 h-3')}</span></p></div>
    </div>
    <button onclick="go('history')" class="relative overflow-hidden block w-full text-left mt-5 rounded-3xl p-5 bg-gradient-to-br ${TIER_CARD[m.tier] || TIER_CARD.Member} shadow-soft">
      <div class="absolute -right-4 -top-2 opacity-25">${icon('crown', 'w-32 h-32')}</div>
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-full bg-white/50 grid place-items-center">${icon('crown', 'w-6 h-6')}</div>
        <div><p class="text-xs opacity-70">ระดับสมาชิก</p><p class="text-2xl font-extrabold leading-tight">${esc(m.tier)}</p></div>
      </div>
      <div class="flex items-end justify-between mt-5">
        <p class="text-[32px] font-extrabold leading-none">${coin} ${num(m.points)} <span class="text-lg font-bold">แต้ม</span></p>
        <span class="w-7 h-7 rounded-full bg-white/70 grid place-items-center">${icon('chev', 'w-4 h-4')}</span>
      </div>
      ${m.expiring ? `<p class="text-xs mt-3 opacity-80 flex items-center gap-1.5">${icon('clock', 'w-4 h-4')} ${num(m.expiring.points)} แต้มจะหมดอายุ ${date(m.expiring.at)}</p>` : ''}
    </button>
    ${m.nextTier ? `<div class="mt-5">
      <p class="text-sm font-semibold">ซื้ออีก ${num(m.nextTier.need)} บาท เป็น ${esc(m.nextTier.name)}</p>
      <div class="mt-2 h-2.5 rounded-full bg-mint-50 overflow-hidden"><div class="h-full rounded-full bg-mint-500" style="width:${pct}%"></div></div>
      <p class="text-xs text-slate-400 mt-1.5">${num(m.spend12m)} / ${num(target)} บาท (12 เดือนล่าสุด)</p>
    </div>` : `<p class="mt-5 text-sm font-semibold text-mint-700">คุณอยู่ระดับสูงสุดแล้ว</p>`}
    <div class="grid grid-cols-3 gap-3 mt-6">
      ${menu.map(([ic, t, s, v]) => `<button onclick="go('${v}')" class="rounded-2xl border border-slate-100 shadow-sm py-4 px-2 text-center active:bg-mint-50">
        <span class="text-mint-500 inline-block">${icon(ic, 'w-7 h-7')}</span>
        <p class="text-sm font-semibold mt-1.5">${t}</p><p class="text-[11px] text-slate-400">${s}</p></button>`).join('')}
    </div>
    <div class="mt-6 rounded-3xl bg-gradient-to-br from-mint-50 to-mint-100 p-5 relative overflow-hidden">
      <p class="text-lg font-bold text-mint-700 leading-snug">สะสมแต้ม<br>แลกรางวัลสุดพิเศษ</p>
      <p class="text-xs text-slate-500 mt-1">ทุกการสั่งซื้อได้แต้มอัตโนมัติ</p>
      <div class="absolute right-4 bottom-3 text-mint-500 opacity-80">${icon('gift', 'w-16 h-16')}</div>
    </div>
  </div>`;
};

V.rewards = (tab = 'all') => {
  const tabs = [['all', 'ทั้งหมด'], ['discount', 'ส่วนลด'], ['gift', 'ของแถม'], ['shipping', 'ส่งฟรี']];
  const match = r => tab === 'all' || (tab === 'discount' ? ['baht', 'percent'].includes(r.type) : r.type === tab);
  const list = S.rewards.filter(match);
  return `${header('ของรางวัล')}
  <div class="px-5 pb-10">
    <p class="text-sm text-slate-500">แต้มของคุณ <b class="text-slate-800">${coin} ${num(S.me.points)}</b></p>
    <div class="flex gap-2 mt-3 overflow-x-auto">${tabs.map(([k, t]) => `<button onclick="S.stack[S.stack.length-1][1]='${k}';render()" class="shrink-0 px-4 h-9 rounded-full text-sm ${k === tab ? 'bg-mint-100 text-mint-700 font-semibold' : 'border border-slate-200 text-slate-500'}">${t}</button>`).join('')}</div>
    <div class="mt-4 space-y-3">
    ${list.length ? list.map(r => {
      const short = Number(r.points_cost) > S.me.points, out = r.stock !== '' && Number(r.stock) <= 0;
      return `<div class="flex gap-4 rounded-3xl border border-slate-100 shadow-sm p-3">
        <div class="relative w-28 h-28 shrink-0 rounded-2xl bg-mint-50 overflow-hidden grid place-items-center text-mint-500">
          ${r.image_url ? `<img src="${esc(r.image_url)}" class="w-full h-full object-cover" alt="">` : icon(typeIcon(r.type), 'w-10 h-10')}
          ${r.min_tier ? `<span class="absolute top-1.5 left-1.5 text-[10px] font-semibold bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full">เฉพาะ ${esc(r.min_tier)}</span>` : ''}
        </div>
        <div class="flex-1 min-w-0 flex flex-col">
          <p class="font-bold leading-snug">${esc(r.name)}</p>
          <p class="text-xs text-slate-500 mt-0.5">${esc(rewardLine(r))}${r.stock !== '' ? ` · เหลือ ${num(r.stock)} ชิ้น` : ''}</p>
          <p class="font-semibold mt-1.5">${Number(r.points_cost) ? `${coin} ${num(r.points_cost)} แต้ม` : '<span class="text-mint-600">ฟรี</span>'}</p>
          <button ${short || out ? 'disabled' : ''} onclick="go('confirm','${esc(r.reward_id)}')" class="mt-auto h-9 rounded-full bg-mint-500 text-white text-sm font-semibold disabled:bg-slate-100 disabled:text-slate-400">${out ? 'หมดแล้ว' : short ? 'แต้มไม่พอ' : 'แลกรางวัล'}</button>
        </div></div>`;
    }).join('') : `<p class="text-center text-slate-400 py-16">ยังไม่มีรางวัลในหมวดนี้</p>`}
    </div></div>`;
};

V.confirm = (id) => {
  const r = S.rewards.find(x => x.reward_id === id), cost = Number(r.points_cost || 0);
  return `${header('ยืนยันการแลก')}
  <div class="px-5 pb-10">
    <div class="rounded-3xl bg-mint-50 aspect-[4/3] overflow-hidden grid place-items-center text-mint-500">${r.image_url ? `<img src="${esc(r.image_url)}" class="w-full h-full object-cover" alt="">` : icon(typeIcon(r.type), 'w-20 h-20')}</div>
    <h2 class="text-xl font-bold mt-5">${esc(r.name)}</h2>
    <p class="text-slate-500 text-sm mt-1">${esc(rewardLine(r))} · ใช้ได้ ${num(r.valid_days || 30)} วันหลังแลก</p>
    <div class="mt-5 rounded-2xl border border-slate-100 divide-y divide-slate-100 text-sm">
      <div class="flex justify-between p-4"><span class="text-slate-500">แต้มปัจจุบัน</span><b>${num(S.me.points)}</b></div>
      <div class="flex justify-between p-4"><span class="text-slate-500">ใช้แลก</span><b class="text-rose-500">-${num(cost)}</b></div>
      <div class="flex justify-between p-4"><span class="text-slate-500">คงเหลือหลังแลก</span><b class="text-mint-700">${num(S.me.points - cost)}</b></div>
    </div>
    <div class="mt-8">${btn('ยืนยันการแลก', `doRedeem(this,'${esc(id)}')`)}</div>
  </div>`;
};

V.redeemed = (c) => `${header('แลกสำเร็จ', { back: false })}
  <div class="px-6 pt-6 pb-10 text-center">
    <div class="w-20 h-20 rounded-full bg-mint-500 text-white grid place-items-center mx-auto shadow-soft">${icon('check', 'w-10 h-10')}</div>
    <h2 class="text-2xl font-bold text-mint-700 mt-5">แลกรางวัลสำเร็จ!</h2>
    <p class="text-slate-500 mt-1">${esc(c.name)} ถูกเก็บไว้ในคูปองของฉันแล้ว<br>ใช้ได้ถึง ${date(c.expires_at)}</p>
    <div class="mt-8">${btn('ไปที่คูปองของฉัน', "S.stack=[['home']];go('coupons')")}</div>
    <button onclick="S.stack=[['home']];render()" class="mt-3 h-12 w-full text-slate-500 font-semibold">กลับหน้าบัตรสมาชิก</button>
  </div>`;

V.coupons = (tab = 'ready') => {
  const groups = { ready: [], used: [], expired: [] };
  S.coupons.forEach(c => groups[couponState(c)].push(c));
  const tabs = [['ready', 'ใช้ได้'], ['used', 'ใช้แล้ว'], ['expired', 'หมดอายุ']];
  const list = groups[tab];
  return `${header('คูปองของฉัน')}
  <div class="px-5 pb-10">
    <div class="grid grid-cols-3 gap-2">${tabs.map(([k, t]) => `<button onclick="S.stack[S.stack.length-1][1]='${k}';render()" class="h-10 rounded-full text-sm ${k === tab ? 'bg-mint-100 text-mint-700 font-semibold' : 'border border-slate-200 text-slate-500'}">${t} (${groups[k].length})</button>`).join('')}</div>
    <div class="mt-4 space-y-3">
    ${list.length ? list.map(c => `<div class="rounded-3xl border border-slate-100 shadow-sm p-4 ${tab === 'ready' ? '' : 'opacity-60'}">
        <div class="flex gap-4">
          <div class="w-16 h-16 shrink-0 rounded-2xl bg-mint-50 text-mint-500 grid place-items-center">${icon(typeIcon(c.type), 'w-8 h-8')}</div>
          <div class="min-w-0">
            <p class="font-bold text-lg leading-snug">${esc(c.name)}</p>
            <p class="text-xs text-slate-500">${esc(rewardLine(c))}</p>
            <p class="text-xs text-slate-500 mt-1.5 flex items-center gap-1">${icon('cal', 'w-3.5 h-3.5')} ${tab === 'used' ? `ใช้เมื่อ ${date(c.used_at)}` : `ใช้ได้ถึง ${date(c.expires_at)}`}</p>
          </div>
        </div>
        ${tab === 'ready' ? `<div class="mt-4">${btn('ใช้คูปอง', `askUse('${esc(c.code)}')`, 'h-11')}</div>` : tab === 'used' ? `<button onclick="go('code','${esc(c.code)}')" class="mt-3 text-sm text-mint-600 font-semibold">ดูโค้ด</button>` : ''}
      </div>`).join('') : `<p class="text-center text-slate-400 py-16">ไม่มีคูปอง</p>`}
    </div></div>`;
};

V.code = (code) => {
  const c = S.coupons.find(x => x.code === code);
  return `${header('คูปองส่วนลด')}
  <div class="px-6 pt-4 pb-10 text-center">
    <div class="w-20 h-20 rounded-full bg-mint-500 text-white grid place-items-center mx-auto shadow-soft">${icon('check', 'w-10 h-10')}</div>
    <h2 class="text-2xl font-bold text-mint-700 mt-4">พร้อมใช้งานแล้ว!</h2>
    <div class="ticket mt-6 rounded-3xl bg-white shadow-soft border border-slate-100 py-6 px-4">
      <p class="text-2xl font-bold text-mint-700">${esc(c.name)}</p>
      <p class="text-slate-500 text-sm mt-1">${esc(rewardLine(c))}</p>
      <div class="border-t-2 border-dashed border-mint-100 my-5"></div>
      <p class="text-[42px] font-extrabold tracking-wider text-slate-900 leading-none">${esc(c.code.slice(0, 4))}-${esc(c.code.slice(4))}</p>
    </div>
    <p class="mt-5 inline-flex items-center gap-2 rounded-2xl border border-slate-100 px-4 py-3 text-sm text-slate-600">${icon('clock', 'w-4 h-4')} กดใช้เมื่อ ${date(c.used_at)} · ${time(c.used_at)}</p>
    <div class="mt-5 flex items-center gap-4 text-left rounded-2xl bg-mint-50 p-4">
      <span class="text-mint-600">${icon('phone', 'w-9 h-9')}</span>
      <div><p class="font-bold text-mint-700">แคปหน้าจอนี้ส่งให้แอดมิน</p><p class="text-xs text-slate-500">เพื่อรับส่วนลดได้เลยค่ะ</p></div>
    </div>
  </div>`;
};

V.history = () => {
  const label = h => h.reason === 'บิล' ? `ซื้อสินค้า บิล #${esc(h.ref)}` : esc(h.reason);
  return `${header('ประวัติแต้ม')}
  <div class="px-5 pb-10">
    <div class="rounded-3xl bg-mint-50 p-5 flex justify-between items-center">
      <span class="text-sm text-slate-500">แต้มคงเหลือ</span><span class="text-2xl font-extrabold">${coin} ${num(S.me.points)}</span>
    </div>
    <div class="mt-4 divide-y divide-slate-100">
    ${S.history.length ? S.history.map(h => { const plus = Number(h.delta) > 0; return `<div class="flex items-center gap-3 py-4">
        <div class="w-10 h-10 rounded-full grid place-items-center ${plus ? 'bg-mint-50 text-mint-600' : 'bg-rose-50 text-rose-500'}">${icon(plus ? 'gift' : 'ticket', 'w-5 h-5')}</div>
        <div class="flex-1 min-w-0"><p class="font-semibold truncate">${label(h)}</p><p class="text-xs text-slate-400">${date(h.created_at)} · ${time(h.created_at)}</p></div>
        <p class="font-bold ${plus ? 'text-mint-600' : 'text-rose-500'}">${plus ? '+' : ''}${num(h.delta)}</p>
      </div>`; }).join('') : `<p class="text-center text-slate-400 py-16">ยังไม่มีรายการ</p>`}
    </div></div>`;
};

// ---------- actions ----------
async function busy(el, fn) {
  el.disabled = true; const t = el.innerHTML; el.innerHTML = 'กำลังดำเนินการ...';
  try { await fn(); } catch (e) { toast(e.message); el.disabled = false; el.innerHTML = t; }
}

function doBind(el) {
  const phone = document.getElementById('phone').value, birthday = document.getElementById('bday').value;
  if (!document.getElementById('consent').checked) return toast('กรุณายอมรับนโยบายความเป็นส่วนตัว');
  busy(el, async () => {
    try { await api('bind', { phone, birthday, consent: true }); }
    catch (e) { S.stack = [['bind', e.message]]; return render(); }
    await loadHome();
  });
}

function doRedeem(el, id) {
  busy(el, async () => {
    const c = await api('redeem', { rewardId: id });
    const r = S.rewards.find(x => x.reward_id === id);
    [S.me, S.coupons] = await Promise.all([api('me'), api('coupons')]);
    S.stack.push(['redeemed', { ...c, name: r.name }]); render();
  });
}

function askUse(code) {
  const c = S.coupons.find(x => x.code === code);
  const m = document.createElement('div');
  m.className = 'fixed inset-0 z-40 bg-slate-900/40 flex items-end sm:items-center justify-center';
  m.innerHTML = `<div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 pb-8">
    <p class="text-lg font-bold">ใช้คูปอง "${esc(c.name)}"?</p>
    <p class="text-slate-500 text-sm mt-2">กดแล้วใช้ได้ครั้งเดียว กดตอนที่จะส่งให้แอดมินเท่านั้น</p>
    <div class="mt-6 space-y-2">${btn('ใช้เลย', `confirmUse(this,'${esc(code)}')`)}<button class="w-full h-12 text-slate-500 font-semibold" onclick="this.closest('.fixed').remove()">ยกเลิก</button></div></div>`;
  document.body.append(m);
}

function confirmUse(el, code) {
  busy(el, async () => {
    const used = await api('useCoupon', { code });
    const c = S.coupons.find(x => x.code === code);
    Object.assign(c, { status: used.status, used_at: used.used_at });
    el.closest('.fixed').remove();
    go('code', code);
  });
}

async function loadHome() {
  const me = await api('me');
  if (!me.linked) { S.stack = [['bind']]; return render(); }
  [S.rewards, S.coupons, S.history] = await Promise.all([api('rewards'), api('coupons'), api('history')]);
  S.me = me; S.stack = [['home']]; render();
}

// History & coupon screens reload on open so a bill or redemption made elsewhere shows up.
const _go = go;
go = (v, a) => {
  _go(v, a);
  if (v === 'history') api('history').then(h => { S.history = h; if (S.stack.at(-1)[0] === 'history') render(); }).catch(() => {});
};

async function start() {
  app.innerHTML = V.loading();
  try {
    if (!DEMO) {
      if (!OA) throw new Error('ลิงก์ไม่ถูกต้อง กรุณาเปิดจากเมนูใน LINE');
      const { liffId } = await api('config');
      await liff.init({ liffId });
      if (!liff.isLoggedIn()) return liff.login({ redirectUri: location.href });
      S.idToken = liff.getIDToken();
    }
    await loadHome();
  } catch (e) { showError(e.message); }
}

async function demo(action, x) {
  await new Promise(r => setTimeout(r, 300));
  if (action === 'me') return D.linked ? D.me : { linked: false };
  if (action === 'bind') { if (x.phone.replace(/\D/g, '') === '0811111111') throw new Error('เบอร์นี้ถูกใช้แล้ว กรุณาทักแอดมิน'); D.linked = true; return { linked: true }; }
  if (action === 'rewards') return D.rewards;
  if (action === 'coupons') return D.coupons;
  if (action === 'history') return D.history;
  if (action === 'redeem') {
    const r = D.rewards.find(x2 => x2.reward_id === x.rewardId);
    D.me.points -= Number(r.points_cost);
    const c = { code: Math.random().toString(36).slice(2, 10).toUpperCase(), name: r.name, type: r.type, value: r.value, status: 'ready', expires_at: new Date(Date.now() + r.valid_days * 864e5).toISOString() };
    D.coupons.unshift(c); return c;
  }
  if (action === 'useCoupon') return { status: 'used', used_at: nowIso() };
}

start();
